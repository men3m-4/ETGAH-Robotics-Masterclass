controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom

    controller_frequency: 10.0
    enable_stamped_cmd_vel: false

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.20

      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0

      acc_lim_x: 0.75
      acc_lim_y: 0.0
      acc_lim_theta: 1.80

      decel_lim_x: -0.75
      decel_lim_y: 0.0
      decel_lim_theta: -1.80

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40

      sim_time: 1.7
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.5

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "ObstacleFootprint"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      ObstacleFootprint.scale: 0.02

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10

      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.125, 0.150], [-0.140, 0.150], [-0.140, -0.150], [0.125, -0.150]]"
      footprint_padding: 0.01

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.15
          obstacle_max_range: 5.0

          raytrace_min_range: 0.15
          raytrace_max_range: 6.0

          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 5.0

      always_send_full_costmap: true