planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      # Search tolerance around the requested goal.
      # Final arrival tolerance belongs to the controller's goal checker.
      tolerance: 0.15

      # Use Dijkstra for global planning.
      use_astar: false

      # Navigate through mapped space.
      allow_unknown: false


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 2.0
      publish_frequency: 1.0

      transform_tolerance: 0.5
      resolution: 0.05

      rolling_window: false
      track_unknown_space: true

      # Collision envelope measured in base_footprint.
      # Coordinates are in meters, ordered around the perimeter.
      footprint: "[[0.125, 0.150], [-0.140, 0.150], [-0.140, -0.150], [0.125, -0.150]]"
      footprint_padding: 0.01

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.15
          obstacle_max_range: 5.0

          raytrace_min_range: 0.15
          raytrace_max_range: 6.0

          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.3
        cost_scaling_factor: 8.0

      always_send_full_costmap: true