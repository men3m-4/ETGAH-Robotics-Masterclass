amcl:
  ros__parameters:
    use_sim_time: true

    # MABot frames and scan topic
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    # Differential motion approximation for MABot
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Use the range limits reported by LaserScan
    laser_model_type: likelihood_field
    laser_min_range: -1.0
    laser_max_range: -1.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    do_beamskip: false

    # Process updates after small movements
    update_min_d: 0.10
    update_min_a: 0.10

    # AMCL owns map -> odom
    tf_broadcast: true
    transform_tolerance: 1.0

    # Set the initial pose manually in RViz
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
